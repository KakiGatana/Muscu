<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#131211">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entraînement">
<title>Entraînement</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 200 200">
    <circle class="sp-fill" cx="100" cy="100" r="92"/>
    <circle class="sp1" pathLength="1" cx="100" cy="100" r="92"/>
    <circle class="sp2" pathLength="1" cx="100" cy="100" r="76"/>
    <circle class="sp3" pathLength="1" cx="100" cy="100" r="52"/>
    <circle class="sp4" pathLength="1" cx="100" cy="100" r="16"/>
  </svg>
  <div class="sp-word"><span style="animation-delay:0.90s">E</span><span style="animation-delay:0.95s">N</span><span style="animation-delay:1.00s">T</span><span style="animation-delay:1.05s">R</span><span style="animation-delay:1.10s">A</span><span style="animation-delay:1.15s">Î</span><span style="animation-delay:1.20s">N</span><span style="animation-delay:1.25s">E</span><span style="animation-delay:1.30s">M</span><span style="animation-delay:1.35s">E</span><span style="animation-delay:1.40s">N</span><span style="animation-delay:1.45s">T</span></div>
</div>
<div id="banner" hidden><span>Nouvelle version disponible</span><button id="reload">Actualiser</button></div>
<div id="app"></div>
<div id="timer"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
