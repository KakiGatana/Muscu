<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tandem">
<title>TANDEM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 512 300" width="260" height="152">
    <defs>
      <linearGradient id="sp-e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecb55a"/><stop offset="1" stop-color="#cf5a2e"/></linearGradient>
      <linearGradient id="sp-o" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a0e0"/><stop offset="1" stop-color="#c45a84"/></linearGradient>
      <linearGradient id="sp-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3a65a"/><stop offset=".5" stop-color="#f3eef8"/><stop offset="1" stop-color="#c9638a"/></linearGradient>
    </defs>
    <rect class="sp-bar" x="52" y="134" width="408" height="32" rx="16" fill="url(#sp-b)"/>
    <g class="sp-l"><rect x="96" y="6" width="58" height="288" rx="22" fill="url(#sp-e)"/><rect x="162" y="42" width="40" height="216" rx="16" fill="url(#sp-e)" opacity=".85"/></g>
    <g class="sp-r"><rect x="358" y="6" width="58" height="288" rx="22" fill="url(#sp-o)"/><rect x="310" y="42" width="40" height="216" rx="16" fill="url(#sp-o)" opacity=".85"/></g>
  </svg>
  <div class="sp-word disp"><span>T</span><span>A</span><span>N</span><span>D</span><span>E</span><span>M</span></div>
</div>
<div id="banner" hidden><span>✨ Nouvelle version disponible</span><button id="reload">Actualiser</button></div>
<div id="app"></div>
<div id="timer"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
